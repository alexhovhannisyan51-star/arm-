<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog -- Locus</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0B1D30;
      color: #E8EEF2;
      font-family: 'IBM Plex Sans', sans-serif;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    body.loaded { opacity: 1; }
    body.fading-out { opacity: 0; }

    header {
      border-bottom: 1px solid #1E3A52;
      padding: 16px 24px;
    }
    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
    }
    .back-link {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #1E3A52;
      color: #6FD1C6;
      text-decoration: none;
      font-size: 13px;
    }
    .back-link:hover { background: #12293F; }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 28px;
      margin: 0 0 8px;
    }
    .subhead {
      color: #9FB3C2;
      font-size: 15px;
      margin: 0 0 24px;
      max-width: 620px;
      line-height: 1.6;
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    #diseaseInput {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #1E3A52;
      background: #0F2438;
      color: #E8EEF2;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
    }
    #diseaseInput::placeholder { color: #63798A; }
    #diseaseButton {
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      background: #0C7C7C;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .examples {
      margin-bottom: 28px;
    }
    .examples-label {
      font-size: 12px;
      color: #63798A;
      margin-bottom: 10px;
    }
    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .example-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #1E3A52;
      background: transparent;
      color: #9FB3C2;
      font-size: 13px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .example-chip:hover {
      border-color: #0C7C7C;
      color: #6FD1C6;
    }
    .status-message {
      color: #63798A;
      font-size: 14px;
      padding: 40px 0;
      text-align: center;
    }
    .result-summary {
      font-size: 13px;
      color: #9FB3C2;
      margin-bottom: 14px;
    }
    .gene-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .gene-card {
      display: block;
      background: #0F2438;
      border: 1px solid #1E3A52;
      border-radius: 8px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
    }
    .gene-card:hover { background: #12293F; border-color: #0C7C7C; }
