<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog -- Locus</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0B1D30;
      color: #E8EEF2;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    header {
      border-bottom: 1px solid #1E3A52;
      padding: 16px 24px;
    }
    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
    }
    .ai-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 16px;
      cursor: help;
    }
    .ai-badge .square {
      width: 22px;
      height: 22px;
      background: #0C7C7C;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 11px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ai-badge span.label {
      font-size: 12px;
      color: #9FB3C2;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 28px;
      margin: 0 0 8px;
    }
    .subhead {
      color: #9FB3C2;
      font-size: 15px;
      margin: 0 0 24px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    #diseaseInput {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #1E3A52;
      background: #0F2438;
      color: #E8EEF2;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
    }
    #diseaseInput::placeholder { color: #63798A; }
    #diseaseButton {
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      background: #0C7C7C;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .status-message {
      color: #63798A;
      font-size: 14px;
      padding: 40px 0;
      text-align: center;
    }
    .gene-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .gene-card {
      display: block;
      background: #0F2438;
      border: 1px solid #1E3A52;
      border-radius: 8px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
    }
    .gene-card:hover { background: #12293F; }
    .gene-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #6FD1C6;
    }
    .gene-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #9FB3C2;
      margin: 4px 0 8px;
    }
    .gene-conditions {
      font-size: 12px;
      color: #63798A;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="logo.png" alt="Locus logo" style="height: 32px; width: auto;" />
      <span class="logo">Locus</span>
      <div class="ai-badge" title="CADD pathogenicity scores in this data are computed using a machine-learning model">
        <span class="square">AI</span>
        <span class="label">Powered by AI</span>
      </div>
      <nav style="margin-left: auto; display: flex; align-items: center; gap: 20px;">
        <a href="index.html" style="color: #9FB3C2; text-decoration: none; font-size: 14px;">Home</a>
        <a href="database.html" style="color: #9FB3C2; text-decoration: none; font-size: 14px;">Database</a>
        <a href="catalog.html" style="color: #E8EEF2; text-decoration: none; font-size: 14px;">Catalog</a>
        <a href="contact.html" style="color: #9FB3C2; text-decoration: none; font-size: 14px;">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Disease → Gene Catalog</h1>
    <p class="subhead">Search a condition or disease name to see which genes are linked to it in ClinVar.</p>

    <div class="search-row">
      <input id="diseaseInput" type="text" placeholder="e.g. cardiovascular, epilepsy, deafness" />
      <button id="diseaseButton">Search</button>
    </div>

    <div id="results"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://bgbcudbidruynnzlxurh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnYmN1ZGJpZHJ1eW5uemx4dXJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzk5NDYsImV4cCI6MjEwMDI1NTk0Nn0.pK7K0XZIZoXGv_s7_yq5tToZl0tY61rpkidVyRHP1Tw";

    async function searchDisease(term) {
      const resultsEl = document.getElementById("results");
      const t = term.trim().replace(/[,()%]/g, "");

      if (!t) {
        resultsEl.innerHTML = '<p class="status-message">Type a condition name above, e.g. "cardiovascular".</p>';
        return;
      }

      resultsEl.innerHTML = '<p class="status-message">Searching…</p>';

      try {
        const params = new URLSearchParams();
        params.set("select", "gene,clinvar_conditions");
        params.set("clinvar_conditions", `ilike.*${t}*`);
        params.set("limit", "1000");

        const res = await fetch(`${SUPABASE_URL}/rest/v1/variants?${params.toString()}&apikey=${SUPABASE_ANON_KEY}`);
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Supabase error ${res.status}: ${body.slice(0, 140)}`);
        }
        const data = await res.json();
        renderGenes(data, t);
      } catch (err) {
        resultsEl.innerHTML = `<p class="status-message" style="color:#F28B82;">${err.message}</p>`;
      }
    }

    function renderGenes(rows, term) {
      const resultsEl = document.getElementById("results");
      const geneMap = {};

      rows.forEach((row) => {
        if (!row.gene) return;
        if (!geneMap[row.gene]) geneMap[row.gene] = { count: 0, conditions: new Set() };
        geneMap[row.gene].count += 1;
        if (row.clinvar_conditions) {
          row.clinvar_conditions.split(";").forEach((c) => {
            c = c.trim();
            if (c.toLowerCase().includes(term.toLowerCase())) {
              geneMap[row.gene].conditions.add(c);
            }
          });
        }
      });

      const genes = Object.keys(geneMap).sort();

      if (genes.length === 0) {
        resultsEl.innerHTML = '<p class="status-message">No genes found linked to that condition. Try a broader term.</p>';
        return;
      }

      resultsEl.innerHTML = `<div class="gene-grid">${genes
        .map((gene) => {
          const info = geneMap[gene];
          const condList = Array.from(info.conditions).slice(0, 3).join(", ");
          const more = info.conditions.size > 3 ? ` +${info.conditions.size - 3} more` : "";
          return `
            <a class="gene-card" href="database.html?gene=${encodeURIComponent(gene)}">
              <div class="gene-name">${gene}</div>
              <div class="gene-count">${info.count} matching variant${info.count !== 1 ? "s" : ""}</div>
              <div class="gene-conditions">${condList}${more}</div>
            </a>
          `;
        })
        .join("")}</div>`;
    }

    document.getElementById("diseaseButton").addEventListener("click", () => {
      searchDisease(document.getElementById("diseaseInput").value);
    });
    document.getElementById("diseaseInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchDisease(e.target.value);
    });
  </script>

</body>
</html>
